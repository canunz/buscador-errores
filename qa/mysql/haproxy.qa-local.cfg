# TCP forwarding only. No credentials, SQL inspection, traffic logs or admin socket.
global
    maxconn 40

defaults
    mode tcp
    timeout connect 5s
    timeout client 60m
    timeout server 60m

resolvers docker
    nameserver embedded 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend qa_mysql_local
    bind :13318
    default_backend qa_mysql_only

backend qa_mysql_only
    server mysql mysql:3306 resolvers docker resolve-prefer ipv4 init-addr last,libc,none
