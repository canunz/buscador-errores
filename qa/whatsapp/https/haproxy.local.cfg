# PROPUESTO para host Linux con Spring en el MISMO host. No iniciar públicamente.
# Entrada HTTP loopback para un futuro túnel autorizado con terminación HTTPS.
# TLS en proxy dedicado se documenta por separado; aquí NO hay dominio/certificado.
global
    maxconn 32

defaults
    mode http
    timeout connect 3s
    timeout client 20s
    timeout server 25s
    timeout http-request 10s
    timeout http-keep-alive 5s
    timeout queue 3s
    option http-buffer-request
    # Sin log global, httplog, capturas ni stats; nunca registrar query o cuerpo.

frontend webhook_local
    bind 127.0.0.1:18080
    acl ruta_exacta path -m str /webhooks/whatsapp
    acl metodo_permitido method GET POST
    http-request deny deny_status 403 unless ruta_exacta metodo_permitido
    # Restringir también la representación cruda; no normalizar rutas del cliente.
    acl uri_sin_query url -m str /webhooks/whatsapp
    acl uri_con_query url_beg /webhooks/whatsapp?
    http-request deny deny_status 403 unless uri_sin_query or uri_con_query
    acl largo_declarado req.hdr_val(content-length) gt 3145728
    acl largo_buffer req.body_size gt 3145728
    http-request deny deny_status 413 if largo_declarado or largo_buffer
    http-request del-header Forwarded
    http-request del-header X-Forwarded-For
    http-request del-header X-Forwarded-Host
    http-request del-header X-Forwarded-Proto
    http-request del-header X-Real-IP
    http-request del-header Authorization
    http-request del-header Proxy-Authorization
    http-request del-header Cookie
    default_backend spring_local

backend spring_local
    # No URL rewrite, decompression, body replacement, retries or redirects.
    # Spring limita también lectura real a 3 MiB y valida HMAC original.
    server spring 127.0.0.1:18081 maxconn 16
