# Comunicación real con Meta para dimabug-wa-pilot.service (se suma a 80-recursos-arranque.conf).
# - Token Graph como credencial systemd (configtree), nunca en application.properties.
# - Salida a Graph y al CDN de medios solo por la pasarela local GraphHttpsProxy (127.0.0.1:18888); el servicio
#   mantiene IPAddressDeny=any / IPAddressAllow=localhost.
# - JAVA_TOOL_OPTIONS repite las opciones de 80-recursos-arranque.conf porque esta línea la reemplaza.
[Service]
LoadCredential=dimabug.whatsapp.meta-qa.graph-token:/etc/dimabug-wa-pilot/secrets/graph-token
Environment="JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=18888"
