# Drop-in para dimabug-wa-pilot.service (QA). Causa raíz del arranque >180 s, según el journal del 21-11-2026:
#   - Memoria: pico 393.1 MiB con MemoryHigh=384 MiB -> el kernel frena el proceso (sin OOM ni error).
#   - CPU: CPUQuota=50 %; 68.5 s de CPU en ~215 s de reloj: el resto fueron esperas por el freno de memoria.
#   - La aplicación AVANZABA (Hikari 02:01:40, JPA 02:02:07, beans web 02:03:54): no estaba bloqueada.
#   - El primer intento (01:49) falló por "Connection attempt exceeded defined timeout" con Hikari 3000 ms,
#     consecuencia del mismo freno durante el handshake TLS con MySQL.
#
# Instalar:  sudo install -m 0644 -D 80-recursos-arranque.conf /etc/systemd/system/dimabug-wa-pilot.service.d/80-recursos-arranque.conf
#            sudo systemctl daemon-reload
# Revertir:  sudo rm /etc/systemd/system/dimabug-wa-pilot.service.d/80-recursos-arranque.conf && sudo systemctl daemon-reload
#
# Las opciones JVM van por JAVA_TOOL_OPTIONS para no cambiar ExecStart: thread_check.py y startup_check.py
# validan la línea de comandos exacta y copian ExecStart desde el archivo principal de la unidad.
[Service]
# Holgura sobre el pico observado (393 MiB). Requiere ~1 GiB disponible en el servidor (lo exige startup_check.py).
MemoryHigh=640M
MemoryMax=768M
# Un núcleo completo durante el arranque; sigue con prioridad baja frente a staging (CPUWeight=25).
CPUQuota=100%
# Menor huella y arranque más rápido para un servicio QA de bajo tráfico:
#   SerialGC: sin hilos ni estructuras de G1; TieredStopAtLevel=1: solo C1 (menos CPU y code cache);
#   Xss512k: pilas de hilo más pequeñas; MaxMetaspaceSize=160m: margen sobre el uso de Spring + Hibernate.
Environment="JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k -XX:MaxMetaspaceSize=160m"
# Limita las arenas de malloc de glibc (cada hilo puede reservar la suya y elevar la memoria residente).
Environment=MALLOC_ARENA_MAX=2
