# Opt-in local: requiere también qa-whatsapp-http-local. Nunca crea/migra tablas.
spring.jpa.mapping-resources=META-INF/whatsapp.orm.xml
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
# Las dos claves Base64 (32 bytes distintas) se suministran externamente:
# dimabug.whatsapp.durable.clave-cifrado
# dimabug.whatsapp.durable.clave-hmac
dimabug.whatsapp.durable.trabajadores=true
