# Configuración de MySQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Seguridad JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Servidor
server.port=9090

# Login con código de acceso. Los valores reales van en el servidor (env), no en Git.
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
dimabug.auth.codigo.minutos-vigencia=5
dimabug.auth.codigo.segundos-reenvio=4
dimabug.auth.codigo.remitente-nombre=DimaBug
dimabug.auth.codigo.mostrar-en-log=${DIMABUG_CODIGO_EN_LOG:false}
# Staging: DigitalOcean bloquea SMTP. El código de acceso sale por Gmail API (HTTPS 443).
dimabug.auth.codigo.usar-gmail-api=true
dimabug.gmail.oauth-habilitado=${GMAIL_OAUTH_HABILITADO:true}
dimabug.gmail.envio-real-habilitado=${GMAIL_ENVIO_REAL_HABILITADO:true}
dimabug.gmail.client-id=${GOOGLE_CLIENT_ID:}
dimabug.gmail.client-secret=${GOOGLE_CLIENT_SECRET:}
dimabug.gmail.clave-cifrado=${GMAIL_TOKEN_ENCRYPTION_KEY:}
dimabug.gmail.remitente=${GMAIL_SENDER_EMAIL:dimabug507@gmail.com}
dimabug.gmail.callback=${GMAIL_OAUTH_REDIRECT_URI:https://staging.dimabug.casol.cl/login/oauth2/code/google}
dimabug.gmail.frontend=${GMAIL_FRONTEND_URL:https://staging.dimabug.casol.cl/admin/gmail}

# Automatización: exclusivamente simulación explícita en staging local, sin correo real.
dimabug.automatizacion.modo=${DIMABUG_AUTOMATIZACION_MODO:SIMULADO}
dimabug.automatizacion.recordatorio-1-horas=${DIMABUG_RECORDATORIO_1_HORAS:24}
dimabug.automatizacion.recordatorio-2-horas=${DIMABUG_RECORDATORIO_2_HORAS:72}
dimabug.automatizacion.escalamiento-horas=${DIMABUG_ESCALAMIENTO_HORAS:120}
dimabug.automatizacion.intervalo-ms=${DIMABUG_SEGUIMIENTO_INTERVALO_MS:60000}
# El flujo de fotos aplica su límite de 2 MB por categoría; otros materiales conservan 10 MB.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=32MB

# Límites de dependencia compartida para no dejar lecturas esperando indefinidamente.
spring.datasource.hikari.connection-timeout=${DIMABUG_DB_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.data-source-properties.connectTimeout=3000
spring.datasource.hikari.data-source-properties.socketTimeout=8000
spring.jpa.properties.jakarta.persistence.query.timeout=5000
