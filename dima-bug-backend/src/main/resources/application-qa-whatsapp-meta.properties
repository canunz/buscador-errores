# Etapa 3.2-A: solo preparación LOCAL con eventos sintéticos; nunca Meta real.
server.address=127.0.0.1
server.forward-headers-strategy=none
spring.jpa.mapping-resources=META-INF/whatsapp.orm.xml
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
dimabug.whatsapp.meta-qa.recepcion=false
dimabug.whatsapp.meta-qa.procesamiento=false
dimabug.whatsapp.meta-qa.medios=false
# Despacho de respuestas. Con envio-real=false la salida queda SIMULADA.
dimabug.whatsapp.meta-qa.envio=false
# Guardián: envio-real / conexion-meta solo arrancan si además están configurados
# dimabug.whatsapp.autoatencion.habilitada=true, graph-token y ticket-actor-email.
dimabug.whatsapp.meta-qa.envio-real=false
dimabug.whatsapp.meta-qa.conexion-meta=false
# Autoatención (Hola → ayuda; foto → OCR → solución → ¿se solucionó?; NO o sin solución → ticket DimaBug).
dimabug.whatsapp.autoatencion.habilitada=false
# Externas (nunca en el repositorio):
# dimabug.whatsapp.meta-qa.graph-token  (token de usuario del sistema con whatsapp_business_messaging)
# dimabug.whatsapp.meta-qa.graph-version=v23.0
# dimabug.whatsapp.autoatencion.ticket-actor-email (usuario de servicio con rol Soporte, no Administrador)
# Obligatorias, externamente, todas SINTÉTICAS en esta etapa:
# dimabug.whatsapp.meta-qa.waba / numero / participantes
# participantes: tel:100000000000001=qa-a,bsuid:US.qa-a=qa-a
# dimabug.whatsapp.meta-qa.verify-token / app-secret
# dimabug.whatsapp.durable.clave-cifrado / clave-hmac (Base64 diferentes, 32 bytes)
# dimabug.whatsapp.qa.raiz
# spring.datasource.* (exclusiva de QA, sin migraciones automáticas)
