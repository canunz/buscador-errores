# Perfil exclusivo QA. No importar staging, gmail ni smtp.
spring.application.name=dimabug-qa-local
server.address=127.0.0.1
server.port=19090
spring.datasource.url=jdbc:mysql://127.0.0.1:13318/dima_bug_qa_mvp?serverTimezone=UTC&connectTimeout=3000&socketTimeout=8000&sslMode=VERIFY_CA&fallbackToSystemTrustStore=false&allowPublicKeyRetrieval=false&tlsVersions=TLSv1.2,TLSv1.3&socketFactory=dimabug.qa.PinnedSocketFactory
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=${QA_TLS_TRUSTSTORE_URI}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=JKS
# Integridad de un almacén de certificados PUBLICOS; no es una credencial.
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=qa-public-ca-integrity
spring.datasource.username=dimabug_qa_app
spring.datasource.password=${QA_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

jwt.secret=${QA_JWT_SECRET}
jwt.expiration=1800000

# No se crean ni copian secretos en esta preparación.
dimabug.gmail.oauth-habilitado=false
dimabug.gmail.envio-real-habilitado=false
dimabug.gmail.client-id=
dimabug.gmail.client-secret=
dimabug.gmail.clave-cifrado=
dimabug.gmail.remitente=qa-noreply@dimabug.test
dimabug.gmail.callback=http://localhost:19090/login/oauth2/code/google
dimabug.gmail.frontend=http://localhost:14200/admin/gmail
spring.autoconfigure.exclude=org.springframework.boot.mail.autoconfigure.MailSenderAutoConfiguration
spring.mail.host=
spring.mail.username=
spring.mail.password=

dimabug.automatizacion.modo=DESHABILITADO
dimabug.automatizacion.seguimiento-habilitado=false
dimabug.auth.correo.habilitado=false
dimabug.auth.codigo.minutos-vigencia=5
dimabug.auth.codigo.segundos-reenvio=60
dimabug.auth.codigo.maximo-15-minutos=5
dimabug.auth.codigo.maximo-dia=20
dimabug.auth.limite-ip-minuto=20
dimabug.app.url=http://127.0.0.1:14200

dimabug.storage.materiales-dir=${QA_DATA_DIR}/materiales
dimabug.storage.tickets-dir=${QA_DATA_DIR}/tickets
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=32MB
logging.level.root=INFO
logging.level.cl.casol.backend.identidad.infrastructure.security=INFO
logging.file.name=${QA_DATA_DIR}/logs/backend.log
