# Perfil opcional. Autorizar una cuenta NO activa los envíos reales.
dimabug.gmail.oauth-habilitado=${GMAIL_OAUTH_HABILITADO:false}
dimabug.gmail.envio-real-habilitado=${GMAIL_ENVIO_REAL_HABILITADO:false}
dimabug.gmail.client-id=${GOOGLE_CLIENT_ID:${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:}}
dimabug.gmail.client-secret=${GOOGLE_CLIENT_SECRET:${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:}}
dimabug.gmail.clave-cifrado=${GMAIL_TOKEN_ENCRYPTION_KEY:}
dimabug.gmail.remitente=${GMAIL_SENDER_EMAIL:}
dimabug.gmail.callback=${GMAIL_OAUTH_REDIRECT_URI:http://localhost:9090/login/oauth2/code/google}
dimabug.gmail.frontend=${GMAIL_FRONTEND_URL:http://localhost:4200/admin/gmail}
# Seleccionar GMAIL_API y GMAIL_ENVIO_REAL_HABILITADO=true requiere confirmación explícita.
# No se establece aquí el modo de transporte.
logging.level.org.springframework.web.client=INFO
logging.level.org.springframework.http=INFO
logging.level.org.springframework.security.oauth2=INFO
