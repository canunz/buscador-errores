# Configuración SMTP mediante spring.mail.* o variables SPRING_MAIL_*. Sin credenciales en el repositorio.
# Perfil optativo: añadir smtp a SPRING_PROFILES_ACTIVE únicamente después de la autorización corporativa.
# El perfil no activa envíos por sí solo; también requiere seleccionar explícitamente el modo SMTP.
dimabug.automatizacion.modo=${DIMABUG_AUTOMATIZACION_MODO:DESHABILITADO}
# Mantener tiempos finitos para no bloquear peticiones ante un servidor de correo sin respuesta.
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.starttls.required]=true
spring.mail.properties[mail.smtp.ssl.checkserveridentity]=true
spring.mail.properties[mail.debug]=false
spring.mail.test-connection=false
dimabug.correo.remitente=${SMTP_FROM:${spring.mail.username:}}
dimabug.correo.maximo-intentos-hora=${SMTP_MAX_INTENTOS_HORA:20}
